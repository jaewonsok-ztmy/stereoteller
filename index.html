<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STEREOTELLER</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <main>
    <section class="hero" aria-label="STEREOTELLER 첫 번째 화보">
      <img class="editorial-image" src="https://ecimg.cafe24img.com/pg3454b61729627075/stereoteller/main1.JPG" alt="보라색 후드 집업을 입은 모델" fetchpriority="high">
      <header class="site-header">
        <a class="brand" href="/" aria-label="STEREOTELLER 홈">
          <img src="https://ecimg.cafe24img.com/pg3454b61729627075/stereoteller/logo.png" alt="STEREOTELLER">
        </a>
        <nav class="primary-nav" aria-label="메인 메뉴">
          <a href="/project.html">project</a>
          <a href="https://stereoteller.shop/product/list.html?cate_no=24">shop</a>
        </nav>
        <div class="utility-nav">
          <button type="button" id="searchButton" aria-expanded="false" aria-controls="searchPanel">search</button>
          <a href="https://stereoteller.shop/member/login.html">log in</a>
        </div>
      </header>
      <form class="search-panel" id="searchPanel" action="https://stereoteller.shop/product/search.html" method="get" hidden>
        <label for="keyword">SEARCH</label>
        <div class="search-line">
          <input id="keyword" name="keyword" type="search" placeholder="Search products" required>
          <button type="submit">GO →</button>
          <button type="button" id="closeSearch" aria-label="닫기">×</button>
        </div>
      </form>
    </section>
    <section class="photo-section" aria-label="두 번째 화보">
      <img class="editorial-image" src="https://ecimg.cafe24img.com/pg3454b61729627075/stereoteller/main2.JPG" alt="숲에서 웅크린 보라색 후드 모델" loading="lazy">
    </section>
    <section class="photo-section" aria-label="세 번째 화보">
      <img class="editorial-image" src="https://ecimg.cafe24img.com/pg3454b61729627075/stereoteller/main3.JPG" alt="아이보리색 후드 집업을 입은 모델" loading="lazy">
    </section>
  </main>
  <script src="js/index.js"></script>
</body>
</html>
